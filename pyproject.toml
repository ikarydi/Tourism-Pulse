[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tourism-pulse"
version = "0.1.0"
description = "AI-powered tourism intelligence platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Private" }
authors = [
    { name = "Ioannis Karydis" }
]
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx2>=2,<3",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
]
[tool.setuptools]
package-dir = {"" = "apps/api/src"}

[tool.setuptools.packages.find]
where = ["apps/api/src"]
include = ["tourism_pulse_api*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"