[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tourism-pulse"
version = "0.1.0"
description = "AI-powered tourism intelligence platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Private" }
authors = [
    { name = "Ioannis Karydis" }
]
dependencies = [
     "alembic>=1.15,<2",
    "apscheduler>=3.10,<4",
    "fastapi>=0.115,<1",
    "groq>=1.6,<2",
    # Forecasting (tourism_pulse_api.forecasting) and attention insights.
    "numpy>=2,<3",
    # The European Commission publishes its business surveys only as Excel.
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.34,<1",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx2>=2,<3",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "python-dotenv>=1.0,<2",
]
# Offline research code under research/ (nowcast backtest) - kept out of
# the API's runtime dependencies.
research = [
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "scipy>=1.14,<2",
    "statsmodels>=0.14,<1",
]
[tool.setuptools]
package-dir = {"" = "apps/api/src"}

[tool.setuptools.packages.find]
where = ["apps/api/src"]
include = ["tourism_pulse_api*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"