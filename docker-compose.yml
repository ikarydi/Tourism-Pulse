services:
  postgres:
    build:
      context: ./infrastructure/postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tourism_pulse
      POSTGRES_USER: tourism_pulse
      POSTGRES_PASSWORD: tourism_pulse_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U tourism_pulse -d tourism_pulse"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: